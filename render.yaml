services:
  - type: web
    name: streamit-app
    runtime: image
    repo: https://github.com/YOUR_USERNAME/streamit-laravel
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: StreamIt
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://streamit-app.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: streamit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: streamit-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: streamit-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: streamit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: streamit-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
